---
- name: Install Apache on Ubuntu
  hosts: unode
  become: yes

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Apache2
      apt:
        name: apache2
        state: absent

    - name: Start Apache2 service
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Allow Apache through firewall
      ufw:
        rule: allow
        name: "Apache"
      ignore_errors: yes
